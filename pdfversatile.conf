upstream backend {
    server 127.0.0.1:3000;
}

server {
    server_name pdfversatile.com www.pdfversatile.com;

    keepalive_timeout 15;


    client_max_body_size 510M;
    

    # Cache static files
    location ~* \.(css|js|png|webp|jpg|jpeg|gif|svg|ico|woff|woff2)$ {

        proxy_pass http://backend;

        expires 30d;

        add_header Cache-Control "public, max-age=2592000";

        proxy_http_version 1.1;
    }

    # Everything else goes to Node
    location / {



	    # limit_req zone=my_zone burst=5 nodelay;

        proxy_pass http://backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;


	error_page 500 502 503 504 /502.html;

    }


	location = /502.html {
        root /var/www/errors;
        internal;
    }




    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pdfversatile.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pdfversatile.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.pdfversatile.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = pdfversatile.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80 default_server;
    server_name pdfversatile.com www.pdfversatile.com;
    return 404; # managed by Certbot




}
